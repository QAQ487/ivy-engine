<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Ivy Engine runs</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f1e8;
      --color-ink:     #1a2e24;
      --color-muted:   #3f5c4e;
      --color-accent:  #2b5843;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }

    .dek {
      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
      max-width: 40rem;
      line-height: 1.45;
    }

    svg { width: 100%; min-width: 1280px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Ivy Engine</p>
    <h1>How Ivy Engine runs</h1>
    <p class="dek">Two executables share one scene loop. Your game is a folder that loop loads — it is never compiled into the engine.</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ivy-engine-architecture-title ivy-engine-architecture-desc">
        <title id="ivy-engine-architecture-title">How Ivy Engine runs</title>
        <desc id="ivy-engine-architecture-desc">Ivy Engine editor and runtime hosts both run GameScene, which loads a content project’s scene graph and ticks engine systems, while game scripts stay in GameScripts.dll.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3f5c4e"/></marker>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#246050"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f1e8"/>

        <!-- Zones -->
        <rect x="40" y="136" width="272" height="392" rx="8"

        <text x="176" y="149" fill="rgba(26,46,36,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

        <rect x="368" y="136" width="232" height="264" rx="8"
              fill="rgba(26,46,36,0.02)" stroke="rgba(26,46,36,0.10)" stroke-width="0.8"/>

        <text x="484" y="149" fill="rgba(26,46,36,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">HOSTS</text>

        <rect x="672" y="136" width="552" height="392" rx="8"
              fill="rgba(26,46,36,0.02)" stroke="rgba(26,46,36,0.10)" stroke-width="0.8"/>
        <rect x="904" y="140" width="88" height="12" rx="2" fill="#f5f1e8"/>
        <text x="948" y="149" fill="rgba(26,46,36,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">SHARED LOOP</text>

        <!-- Arrows -->
        <line x1="296" y1="208" x2="384" y2="208" stroke="#3f5c4e" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 948,248 V 312 Q 948,320 956,320 H 1080 Q 1088,320 1088,328 V 448"
              fill="none" stroke="#3f5c4e" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="688" y1="480" x2="296" y2="480" stroke="#3f5c4e" stroke-width="1.2" marker-end="url(#arrow)"/>

        <text x="340" y="197" fill="#7a9084" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPEN</text>

        <rect x="136" y="288" width="32" height="12" rx="2" fill="#f5f1e8"/>
        <text x="152" y="297" fill="#7a9084" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BOOT</text>

        <rect x="648" y="188" width="56" height="12" rx="2" fill="#f5f1e8"/>
        <text x="676" y="197" fill="#2b5843" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EDIT/PLAY</text>

        <!-- Node: Content project (store) -->
        <rect x="56" y="176" width="240" height="64" rx="6" fill="#f5f1e8"/>
        <rect x="56" y="176" width="240" height="64" rx="6" fill="rgba(26,46,36,0.05)" stroke="#3f5c4e" stroke-width="1"/>

        <text x="176" y="212" fill="#1a2e24" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Content project</text>
        <text x="176" y="228" fill="#3f5c4e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">project.json · rom/</text>

        <!-- Node: IvyEngine.exe (backend) -->
        <rect x="384" y="176" width="200" height="64" rx="6" fill="#f5f1e8"/>

        <!-- Node: Runtime host (backend) -->
        <rect x="384" y="320" width="200" height="64" rx="6" fill="#f5f1e8"/>
        <rect x="384" y="320" width="200" height="64" rx="6" fill="#ffffff" stroke="#1a2e24" stroke-width="1"/>

        <text x="484" y="372" fill="#3f5c4e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GAME_RUNTIME</text>

        <!-- Node: GameScene (focal) -->
        <rect x="768" y="168" width="240" height="80" rx="6" fill="#f5f1e8"/>
        <rect x="768" y="168" width="240" height="80" rx="6" fill="rgba(43,88,67,0.08)" stroke="#2b5843" stroke-width="1"/>
        <rect x="776" y="174" width="32" height="12" rx="2" fill="transparent" stroke="rgba(43,88,67,0.50)" stroke-width="0.8"/>
        <text x="792" y="183" fill="#2b5843" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOOP</text>
        <text x="888" y="208" fill="#1a2e24" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GameScene</text>
        <text x="888" y="224" fill="#3f5c4e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/app/scene</text>

        <!-- Node: Scene graph (store) -->
        <rect x="688" y="448" width="200" height="64" rx="6" fill="#f5f1e8"/>
        <rect x="688" y="448" width="200" height="64" rx="6" fill="rgba(26,46,36,0.05)" stroke="#3f5c4e" stroke-width="1"/>

        <text x="788" y="484" fill="#1a2e24" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Scene graph</text>

        <rect x="968" y="448" width="240" height="64" rx="6" fill="#f5f1e8"/>

        <rect x="56" y="448" width="240" height="64" rx="6" fill="#f5f1e8"/>

        <text x="176" y="484" fill="#1a2e24" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">GameScripts.dll</text>
        <text x="176" y="500" fill="#3f5c4e" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ScriptRuntimeApi</text>

        <!-- Legend -->
        <line x1="40" y1="648" x2="1240" y2="648" stroke="rgba(26,46,36,0.10)" stroke-width="0.8"/>

        <rect x="40" y="684" width="14" height="10" rx="2" fill="rgba(43,88,67,0.08)" stroke="#2b5843" stroke-width="1"/>

        <rect x="180" y="684" width="14" height="10" rx="2" fill="#ffffff" stroke="#1a2e24" stroke-width="1"/>

        <rect x="336" y="684" width="14" height="10" rx="2" fill="rgba(26,46,36,0.05)" stroke="#3f5c4e" stroke-width="1"/>
        <text x="356" y="693" fill="#3f5c4e" font-size="8.5" font-family="'Geist', sans-serif">Store</text>

        <rect x="432" y="684" width="14" height="10" rx="2" fill="rgba(26,46,36,0.03)" stroke="rgba(26,46,36,0.30)" stroke-width="1"/>

        <line x1="560" y1="689" x2="588" y2="689" stroke="#2b5843" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
